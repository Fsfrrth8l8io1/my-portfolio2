    /* --- CONTEXTS --- */
    const ThemeContext = createContext();
    const LanguageContext = createContext();

    function ThemeProvider({ children }) {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('athila_theme');
        return saved || 'dark';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.remove('dark');
          root.classList.add('light');
        }
        localStorage.setItem('athila_theme', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme, isDark: theme === 'dark' }}>
          {children}
        </ThemeContext.Provider>
      );
    }

    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => {
        const saved = localStorage.getItem('athila_lang');
        return saved || 'en';
      });

      const isRTL = lang === 'ar';
      const t = translations[lang] || translations.en;

      useEffect(() => {
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
        localStorage.setItem('athila_lang', lang);
      }, [lang, isRTL]);

      const toggleLanguage = () => setLang(prev => prev === 'en' ? 'ar' : 'en');

      return (
        <LanguageContext.Provider value={{ lang, isRTL, t, toggleLanguage }}>
          {children}
        </LanguageContext.Provider>
      );
    }

                      <span className="text-[11px] font-mono font-semibold px-2 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-500/20">
                        Verified
                      </span>
                    </div>
                    <h4 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white group-hover:text-emerald-500 transition-colors">
                      {cert.name}
                    </h4>
                    <p className="text-xs font-medium text-slate-600 dark:text-slate-400 mt-1">
                      {cert.issuer}
                    </p>
                  </div>

                  <div className="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <span className="text-xs font-mono text-slate-400 truncate max-w-[180px]">
                      {cert.credentialId}
                    </span>
                    <span className="text-xs font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1 group-hover:underline">
                      <span>Details</span>
                      <span>→</span>
                    </span>
                  </div>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }

    /* --- SKILLS --- */
    function SkillsSection() {
      const { t } = useContext(LanguageContext);
      const [category, setCategory] = useState('all');

      const cats = [
        { key: 'all', label: t.skills.categories.all },
        { key: 'biochem', label: t.skills.categories.biochem },
        { key: 'molecular', label: t.skills.categories.molecular },
        { key: 'ai', label: t.skills.categories.ai },
        { key: 'pharma', label: t.skills.categories.pharma },
        { key: 'soft', label: t.skills.categories.soft },
      ];

      const skills = category === 'all' ? t.skills.items : t.skills.items.filter(s => s.category === category);

      return (
        <section id="skills" className="relative py-20 scroll-mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="max-w-3xl mb-12">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-md text-xs font-mono font-semibold tracking-wider uppercase text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-500/20 mb-3">
                <span>//</span>
                <span>{t.skills.sectionTag}</span>
              </div>
              <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                {t.skills.title}
              </h2>
              <p className="mt-3 text-base text-slate-600 dark:text-slate-400">
                {t.skills.subtitle}
              </p>
            </div>

            {/* Tabs */}
            <div className="flex flex-wrap items-center gap-2 mb-10 pb-2 border-b border-slate-200 dark:border-slate-800">
              {cats.map((c) => (
                <button
                  key={c.key}
                  onClick={() => setCategory(c.key)}
                  className={`px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                    category === c.key
                      ? 'bg-emerald-600 text-white shadow-md'
                      : 'bg-white/60 dark:bg-slate-800/60 text-slate-600 dark:text-slate-400 hover:text-emerald-500 border border-slate-200 dark:border-slate-700/60'
                  }`}
                >
                  {c.label}
                </button>
              ))}
            </div>

            {/* Skills Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 lg:gap-6 mb-16">
              {skills.map((skill, idx) => (
                <div key={idx} className="glass-panel glass-panel-hover rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 space-y-3">
                  <div className="flex items-start justify-between gap-3">
                    <div>
                      <h4 className="text-sm sm:text-base font-bold text-slate-900 dark:text-white">
                        {skill.name}
                      </h4>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        {skill.desc}
                      </p>
                    </div>
                    <span className="text-xs font-mono font-bold text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shrink-0">
                      {skill.level}%
                    </span>
                  </div>

                  <div className="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-emerald-500 to-cyan-500 rounded-full" style={{ width: `${skill.level}%` }} />
                  </div>
                </div>
              ))}
            </div>

            {/* Languages */}
            <div>
              <div className="mb-6">
                <h3 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-tight">
                  {t.skills.categories.languages}
                </h3>
                <p className="text-xs sm:text-sm text-slate-500">
                  Bilingual scientific communication proficiency
                </p>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {t.skills.languagesList.map((lang, idx) => (
                  <div key={idx} className="glass-panel rounded-2xl p-6 border border-slate-200/80 dark:border-slate-800 space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="text-lg font-bold text-slate-900 dark:text-white">
                        {lang.name}
                      </h4>
                      <span className="text-xs font-mono font-semibold px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-500/20">
                        {lang.level}
                      </span>
                    </div>
                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400">
                      {lang.note}
                    </p>
                    <div className="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                      <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${lang.proficiency}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>
        </section>
      );
    }

    /* --- CONTACT --- */
    function ContactSection() {
      const { t } = useContext(LanguageContext);
      const [copied, setCopied] = useState(null);
      const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });
      const [submitted, setSubmitted] = useState(false);

      const copyText = (txt, type) => {
        navigator.clipboard.writeText(txt);
        setCopied(type);
        setTimeout(() => setCopied(null), 2500);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const mailto = `mailto:athilataher@gmail.com?subject=${encodeURIComponent(
          formData.subject || 'Portfolio Inquiry from ' + formData.name
        )}&body=${encodeURIComponent(`Name: ${formData.name}\nEmail: ${formData.email}\n\nMessage:\n${formData.message}`)}`;
        window.location.href = mailto;
        setSubmitted(true);
        setTimeout(() => setSubmitted(false), 5000);
      };

      return (
        <section id="contact" className="relative py-20 scroll-mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            
            <div className="max-w-3xl mb-12">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-md text-xs font-mono font-semibold tracking-wider uppercase text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-500/20 mb-3">
                <span>//</span>
                <span>{t.contact.sectionTag}</span>
              </div>
              <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
                {t.contact.title}
              </h2>
              <p className="mt-3 text-base text-slate-600 dark:text-slate-400">
                {t.contact.subtitle}
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              
              {/* Direct Info */}
              <div className="lg:col-span-5 space-y-4">
                {/* Email */}
                <div className="glass-panel rounded-2xl p-6 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono uppercase text-slate-400 font-semibold">{t.contact.emailLabel}</span>
                    <button onClick={() => copyText(t.contact.emailValue, 'email')} className="px-2.5 py-1 rounded text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300">
                      {copied === 'email' ? t.contact.copiedMsg : t.contact.copyBtn}
                    </button>
                  </div>
                  <a href={`mailto:${t.contact.emailValue}`} className="block text-base sm:text-lg font-bold text-slate-900 dark:text-white hover:text-emerald-500 font-mono">
                    {t.contact.emailValue}
                  </a>
                </div>

                {/* Phone */}
                <div className="glass-panel rounded-2xl p-6 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-mono uppercase text-slate-400 font-semibold">{t.contact.phoneLabel}</span>
                    <button onClick={() => copyText(t.contact.phoneValue, 'phone')} className="px-2.5 py-1 rounded text-xs font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300">
                      {copied === 'phone' ? t.contact.copiedMsg : t.contact.copyBtn}
                    </button>
                  </div>
                  <a href={`tel:${t.contact.phoneValue}`} className="block text-base sm:text-lg font-bold text-slate-900 dark:text-white hover:text-emerald-500 font-mono">
                    {t.contact.phoneValue}
                  </a>
                </div>

                {/* LinkedIn */}
                <div className="glass-panel rounded-2xl p-6 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <span className="text-xs font-mono uppercase text-slate-400 font-semibold">{t.contact.linkedinLabel}</span>
                  <a href={t.contact.linkedinUrl} target="_blank" rel="noopener noreferrer" className="block text-base sm:text-lg font-bold text-slate-900 dark:text-white hover:text-cyan-500 font-mono break-all">
                    {t.contact.linkedinDisplay} ↗
                  </a>
                </div>

                {/* Location */}
                <div className="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-400">
                  {t.contact.locationLabel}: <strong className="text-slate-800 dark:text-slate-200">{t.contact.locationValue}</strong>
                </div>
              </div>

              {/* Form */}
              <div className="lg:col-span-7">
                <div className="glass-panel rounded-2xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800">
                  <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-2">
                    {t.contact.sendMessage}
                  </h3>
                  {submitted && (
                    <div className="p-4 mb-6 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-200 text-xs sm:text-sm font-medium">
                      {t.contact.formSuccess}
                    </div>
                  )}

                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-mono uppercase text-slate-400 font-semibold mb-1">{t.contact.formName}</label>
                        <input
                          type="text"
                          required
                          value={formData.name}
                          onChange={e => setFormData({ ...formData, name: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-mono uppercase text-slate-400 font-semibold mb-1">{t.contact.formEmail}</label>
                        <input
                          type="email"
                          required
                          value={formData.email}
                          onChange={e => setFormData({ ...formData, email: e.target.value })}
                          className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-mono uppercase text-slate-400 font-semibold mb-1">{t.contact.formSubject}</label>
                      <input
                        type="text"
                        required
                        value={formData.subject}
                        onChange={e => setFormData({ ...formData, subject: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-mono uppercase text-slate-400 font-semibold mb-1">{t.contact.formMessage}</label>
                      <textarea
                        rows="4"
                        required
                        value={formData.message}
                        onChange={e => setFormData({ ...formData, message: e.target.value })}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white font-semibold text-sm shadow-md transition-all"
                    >
                      {t.contact.formSubmit}
                    </button>
                  </form>
                </div>
              </div>

            </div>
          </div>
        </section>
      );
    }

    /* --- MODAL --- */
    function CertificateModal({ cert, onClose }) {
      const { t } = useContext(LanguageContext);
      if (!cert) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm" onClick={onClose}>
          <div className="w-full max-w-xl glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900" onClick={e => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-4 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800">
              <div>
                <span className="text-xs font-mono font-semibold uppercase text-emerald-600 dark:text-emerald-400">
                  {t.education.certTitle}
                </span>
                <h3 className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">
                  {cert.name}
                </h3>
                <p className="text-sm text-slate-500 mt-0.5">{cert.issuer}</p>
              </div>
              <button onClick={onClose} className="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                ✕
              </button>
            </div>

            <div className="space-y-4">
              <div>
                <h4 className="text-xs font-mono uppercase text-slate-400 font-semibold">{t.modal.date}</h4>
                <p className="text-sm font-medium text-slate-800 dark:text-slate-200">{cert.date}</p>
              </div>
              <div>
                <h4 className="text-xs font-mono uppercase text-slate-400 font-semibold">{t.modal.skillsCovered}</h4>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  {cert.skills.split(',').map((s, i) => (
                    <span key={i} className="px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300">
                      {s.trim()}
                    </span>
                  ))}
                </div>
              </div>
              <div>
                <h4 className="text-xs font-mono uppercase text-slate-400 font-semibold">Scope & Description</h4>
                <p className="text-sm text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-800/50 p-3.5 rounded-xl border border-slate-100 dark:border-slate-800 mt-1">
                  {cert.description}
                </p>
              </div>
              <div className="p-3.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                  <span className="block text-[11px] font-mono text-slate-400 uppercase">{t.modal.credentialId}</span>
                  <span className="text-xs font-mono font-bold text-slate-800 dark:text-slate-200">{cert.credentialId}</span>
                </div>
                <span className="px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-100 dark:bg-emerald-900/60 text-emerald-800 dark:text-emerald-200">
                  Verified ✓
                </span>
              </div>
            </div>

            <div className="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
              <button onClick={onClose} className="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200">
                {t.modal.close}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* --- FOOTER --- */
    function Footer() {
      const { t } = useContext(LanguageContext);
      return (
        <footer className="relative py-12 border-t border-slate-200 dark:border-slate-800/80 bg-white/40 dark:bg-slate-950/60 backdrop-blur-md">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <p className="font-bold text-slate-900 dark:text-white text-sm">Athila Taher Mahmoud</p>
              <p className="text-xs text-slate-500">{t.footer.academicAffiliation}</p>
            </div>
            <p className="text-xs text-slate-500 max-w-md text-center">{t.footer.tagline}</p>
            <p className="text-xs font-mono text-slate-400">© 2025/2026. {t.footer.rights}</p>
          </div>
        </footer>
      );
    }

    /* --- ROOT APP --- */
    function App() {
      const [selectedCert, setSelectedCert] = useState(null);

      return (
        <ThemeProvider>
          <LanguageProvider>
            <div className="min-h-screen relative flex flex-col font-sans">
              <ScientificBackdrop />
              <Navbar />
              <main className="flex-grow z-10">
                <Hero />
                <QuickMetrics />
                <ExperienceTimeline />
                <EducationCertifications onSelectCert={setSelectedCert} />
                <SkillsSection />
                <ContactSection />
              </main>
              <Footer />
              <CertificateModal cert={selectedCert} onClose={() => setSelectedCert(null)} />
            </div>
          </LanguageProvider>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
